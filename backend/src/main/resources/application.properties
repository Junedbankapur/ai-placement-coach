# ==========================================
# SPRING BOOT CONFIGURATION - AI INTERVIEW COACH
# ==========================================
# This file is used to configure your backend server, database connections, and external API keys.

# 1. Server Configuration
# The port on which your Spring Boot application will run. By default, it runs on 8080.
server.port=8080

# 2. Database Configuration Placeholder
# IMPORTANT: Do NOT configure these credentials or create the database yet. 
# We will do this together in Phase 7 (Database Configuration Step).
#
spring.datasource.url=jdbc:mysql://localhost:3306/ai_interview_coach?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=juned09
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#
# JPA & Hibernate Settings:
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# 3. Security (JWT) Configuration
# The secret key used to sign the JWT login token. Must be a secure long string.
# We will customize this key during Phase 3 (Security Setup).
app.jwt.secret=9a67a86c8f498c47e8b9a1f592a8e8b28f32230198de3a4f61f7db6ef88cfbf7
app.jwt.expiration-ms=86400000

# 4. Gemini AI Configuration
# The endpoint for calling the Google Gemini API (using Gemini 1.5 Flash by default)
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent
#
# IMPORTANT: Your API Key goes here. Do NOT populate it yet. 
# We will obtain your free Gemini API key and activate it in Phase 7.
gemini.api.key=YOUR_GEMINI_API_KEY

# 5. File Upload Size Configuration
# Set maximum allowed size for uploaded files (default is 1MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
